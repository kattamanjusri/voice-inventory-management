spring.application.name=backend

# Loads application-local.properties (secrets for your machine).
spring.profiles.active=local

# Database connection. Environment variables win if set; otherwise the
# defaults after the colon are used.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voice_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:inventory_user}
spring.datasource.password=${DB_PASSWORD:}

# Our SQL scripts manage the tables, so Hibernate must not change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false